<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" rx="30" fill="#F8FAFC"/>
  <!-- Sclera (Eyeball) -->
  <path d="M 50 200 C 120 100, 280 100, 350 200 C 280 300, 120 300, 50 200 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4"/>
  <!-- Iris -->
  <circle cx="200" cy="200" r="65" fill="#0284C7"/>
  <!-- Iris detail -->
  <circle cx="200" cy="200" r="55" fill="#0369A1"/>
  <!-- Pupil -->
  <circle cx="200" cy="200" r="30" fill="#0F172A"/>
  <!-- Light reflections -->
  <circle cx="185" cy="180" r="14" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="218" cy="215" r="7" fill="#FFFFFF" opacity="0.8"/>
  <!-- Eyelid fold -->
  <path d="M 60 170 C 130 90, 270 90, 340 170" fill="none" stroke="#FDA4AF" stroke-width="4" stroke-linecap="round"/>
  <!-- Eyelashes top -->
  <path d="M 90 160 Q 80 120 70 130" stroke="#1E293B" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 130 135 Q 125 95 115 105" stroke="#1E293B" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 175 125 Q 175 80 170 90" stroke="#1E293B" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 225 125 Q 225 80 230 90" stroke="#1E293B" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 270 135 Q 275 95 285 105" stroke="#1E293B" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 310 160 Q 320 120 330 130" stroke="#1E293B" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Eyelash outline bottom -->
  <path d="M 70 205 C 130 290, 270 290, 330 205" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <!-- Eyelash outline top -->
  <path d="M 50 200 C 120 100, 280 100, 350 200" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
</svg>
