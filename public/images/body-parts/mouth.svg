<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" rx="30" fill="#F8FAFC"/>
  <!-- Open smiling lips -->
  <!-- Top lip -->
  <path d="M 80 200 C 120 150, 170 160, 200 175 C 230 160, 280 150, 320 200 C 270 195, 220 195, 200 205 C 180 195, 130 195, 80 200 Z" fill="#E11D48"/>
  <!-- Inside mouth -->
  <path d="M 80 200 C 120 270, 280 270, 320 200 Z" fill="#881337"/>
  <!-- White teeth (top row) -->
  <path d="M 110 200 C 150 205, 250 205, 290 200 C 280 220, 120 220, 110 200 Z" fill="#FFFFFF"/>
  <!-- Tongue -->
  <path d="M 150 245 C 180 230, 220 230, 250 245 C 240 265, 160 265, 150 245 Z" fill="#FB7185"/>
  <!-- Bottom lip -->
  <path d="M 80 200 C 120 270, 280 270, 320 200 C 280 295, 120 295, 80 200 Z" fill="#F43F5E"/>
</svg>
