<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
    <rect width="400" height="400" rx="30" fill="#F0FDF4"/>
    <!-- Terracotta Pot -->
    <polygon points="130,300 270,300 250,380 150,380" fill="#EA580C" stroke="#C2410C" stroke-width="4"/>
    <rect x="120" y="285" width="160" height="20" rx="6" fill="#C2410C"/>
    <!-- Fleshy Spiky Aloe Leaves Radiating Upward -->
    <!-- Outer leaves -->
    <path d="M 180 290 Q 90 240 70 170 Q 120 220 180 290" fill="#15803D" stroke="#14532D" stroke-width="3"/>
    <path d="M 220 290 Q 310 240 330 170 Q 280 220 220 290" fill="#15803D" stroke="#14532D" stroke-width="3"/>
    <!-- Middle leaves -->
    <path d="M 190 290 Q 130 180 120 90 Q 160 170 190 290" fill="#16A34A" stroke="#14532D" stroke-width="3"/>
    <path d="M 210 290 Q 270 180 280 90 Q 240 170 210 290" fill="#16A34A" stroke="#14532D" stroke-width="3"/>
    <!-- Center spear -->
    <path d="M 195 290 Q 200 130 200 60 Q 205 130 205 290" fill="#22C55E" stroke="#15803D" stroke-width="3"/>
  </svg>