<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" rx="30" fill="#FAF5FF"/>
  <!-- Floor line -->
  <line x1="40" y1="350" x2="360" y2="350" stroke="#E9D5FF" stroke-width="6" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="200" cy="85" r="38" fill="#C084FC" stroke="#7E22CE" stroke-width="5"/>
  <!-- Torso -->
  <path d="M 200 125 L 200 240" stroke="#7E22CE" stroke-width="24" stroke-linecap="round"/>
  <!-- Butterfly Legs (Soles pressed together in center, knees out wide) -->
  <path d="M 190 230 C 130 230, 80 270, 90 320 C 100 340, 160 340, 195 320" fill="none" stroke="#9333EA" stroke-width="20" stroke-linecap="round"/>
  <path d="M 210 230 C 270 230, 320 270, 310 320 C 300 340, 240 340, 205 320" fill="none" stroke="#9333EA" stroke-width="20" stroke-linecap="round"/>
  <!-- Soles together in center -->
  <ellipse cx="200" cy="320" rx="14" ry="18" fill="#C084FC" stroke="#7E22CE" stroke-width="3"/>
  <!-- Hands holding feet -->
  <path d="M 190 145 L 175 250 L 190 310" stroke="#7E22CE" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M 210 145 L 225 250 L 210 310" stroke="#7E22CE" stroke-width="12" stroke-linecap="round" fill="none"/>
</svg>
