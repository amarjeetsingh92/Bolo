<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" rx="30" fill="#FAF5FF"/>
  <!-- Floor line -->
  <line x1="40" y1="350" x2="360" y2="350" stroke="#E9D5FF" stroke-width="6" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="200" cy="90" r="38" fill="#C084FC" stroke="#7E22CE" stroke-width="5"/>
  <!-- Spine / Torso (Upright Posture) -->
  <path d="M 200 130 L 200 240" stroke="#7E22CE" stroke-width="24" stroke-linecap="round"/>
  <!-- Cross-legged base: thighs and crossed shins -->
  <!-- Left Thigh & Knee -->
  <path d="M 190 230 C 140 230, 80 260, 80 300 C 80 340, 160 340, 200 330" fill="none" stroke="#9333EA" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Thigh & Knee -->
  <path d="M 210 230 C 260 230, 320 260, 320 300 C 320 340, 240 340, 200 330" fill="none" stroke="#9333EA" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left Arm resting on knee -->
  <path d="M 190 145 C 130 180, 100 230, 95 285" fill="none" stroke="#7E22CE" stroke-width="12" stroke-linecap="round"/>
  <!-- Right Arm resting on knee -->
  <path d="M 210 145 C 270 180, 300 230, 305 285" fill="none" stroke="#7E22CE" stroke-width="12" stroke-linecap="round"/>
  <!-- Hands on knees -->
  <circle cx="95" cy="285" r="10" fill="#C084FC"/>
  <circle cx="305" cy="285" r="10" fill="#C084FC"/>
</svg>
