<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" rx="30" fill="#FAF5FF"/>
  <!-- Floor line -->
  <line x1="40" y1="350" x2="360" y2="350" stroke="#E9D5FF" stroke-width="6" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="200" cy="85" r="38" fill="#C084FC" stroke="#7E22CE" stroke-width="5"/>
  <!-- Upright Spine -->
  <path d="M 200 125 L 200 240" stroke="#7E22CE" stroke-width="24" stroke-linecap="round"/>
  <!-- Lotus Pose Folded Legs (Feet on Opposite Thighs) -->
  <path d="M 190 230 C 120 230, 70 270, 70 310 C 70 345, 150 345, 230 300" fill="none" stroke="#9333EA" stroke-width="20" stroke-linecap="round"/>
  <path d="M 210 230 C 280 230, 330 270, 330 310 C 330 345, 250 345, 170 300" fill="none" stroke="#9333EA" stroke-width="20" stroke-linecap="round"/>
  <!-- Feet resting upward on thighs -->
  <ellipse cx="230" cy="295" rx="14" ry="9" fill="#C084FC" stroke="#7E22CE" stroke-width="3"/>
  <ellipse cx="170" cy="295" rx="14" ry="9" fill="#C084FC" stroke="#7E22CE" stroke-width="3"/>
  <!-- Mudra Hands resting on knees -->
  <path d="M 190 145 C 130 180, 100 240, 85 290" fill="none" stroke="#7E22CE" stroke-width="12" stroke-linecap="round"/>
  <path d="M 210 145 C 270 180, 300 240, 315 290" fill="none" stroke="#7E22CE" stroke-width="12" stroke-linecap="round"/>
  <circle cx="85" cy="290" r="10" fill="#C084FC"/>
  <circle cx="315" cy="290" r="10" fill="#C084FC"/>
</svg>
