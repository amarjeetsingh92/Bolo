<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" rx="30" fill="#FAF5FF"/>
  <!-- Floor line -->
  <line x1="40" y1="350" x2="360" y2="350" stroke="#E9D5FF" stroke-width="6" stroke-linecap="round"/>
  <!-- Head (Side Profile Kneeling / Vajrasana) -->
  <circle cx="215" cy="85" r="38" fill="#C084FC" stroke="#7E22CE" stroke-width="5"/>
  <!-- Upright Torso -->
  <path d="M 215 125 L 215 240" stroke="#7E22CE" stroke-width="24" stroke-linecap="round"/>
  <!-- Thighs folded over shins -->
  <!-- Thigh horizontal forward -->
  <path d="M 215 240 L 140 280" stroke="#9333EA" stroke-width="22" stroke-linecap="round"/>
  <!-- Shin bent backwards flat to floor -->
  <path d="M 140 280 L 250 340" stroke="#9333EA" stroke-width="20" stroke-linecap="round"/>
  <!-- Feet / Toes tucked behind -->
  <ellipse cx="260" cy="340" rx="15" ry="8" fill="#C084FC"/>
  <!-- Arms resting gently on thighs -->
  <path d="M 215 145 C 195 190, 175 230, 160 270" stroke="#7E22CE" stroke-width="12" stroke-linecap="round"/>
  <circle cx="160" cy="270" r="10" fill="#C084FC"/>
</svg>
