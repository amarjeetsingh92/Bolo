<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" rx="30" fill="#FAF5FF"/>
  <!-- Floor line -->
  <line x1="40" y1="360" x2="360" y2="360" stroke="#E9D5FF" stroke-width="6" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="200" cy="110" r="38" fill="#C084FC" stroke="#7E22CE" stroke-width="5"/>
  <!-- Compact Lowered Torso -->
  <path d="M 200 150 L 200 250" stroke="#7E22CE" stroke-width="24" stroke-linecap="round"/>
  <!-- Deep Squat Legs: Thighs angled up to knees, calves angled down to heels -->
  <!-- Left Leg -->
  <path d="M 190 250 L 110 210 L 120 345" fill="none" stroke="#9333EA" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Leg -->
  <path d="M 210 250 L 290 210 L 280 345" fill="none" stroke="#9333EA" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Grounded Feet -->
  <ellipse cx="115" cy="350" rx="20" ry="10" fill="#7E22CE"/>
  <ellipse cx="285" cy="350" rx="20" ry="10" fill="#7E22CE"/>
  <!-- Prayer hands in center -->
  <path d="M 190 170 L 180 230 L 200 235" stroke="#7E22CE" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M 210 170 L 220 230 L 200 235" stroke="#7E22CE" stroke-width="12" stroke-linecap="round" fill="none"/>
  <circle cx="200" cy="235" r="10" fill="#C084FC"/>
</svg>
