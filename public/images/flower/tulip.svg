<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
    <rect width="400" height="400" rx="30" fill="#FDF2F8"/>
    <!-- Long Stem -->
    <path d="M 200 210 L 200 370" stroke="#15803D" stroke-width="12" stroke-linecap="round"/>
    <!-- Big graceful tulip leaves -->
    <path d="M 200 370 C 130 330, 120 220, 150 180 C 160 250, 180 320, 200 370 Z" fill="#22C55E" stroke="#16A34A" stroke-width="3"/>
    <!-- Tulip Cup Petals -->
    <!-- Left Petal -->
    <path d="M 200 220 C 120 220, 110 120, 160 90 C 170 130, 190 170, 200 220 Z" fill="#E11D48"/>
    <!-- Right Petal -->
    <path d="M 200 220 C 280 220, 290 120, 240 90 C 230 130, 210 170, 200 220 Z" fill="#E11D48"/>
    <!-- Center Petal -->
    <path d="M 155 130 C 175 60, 225 60, 245 130 C 230 180, 170 180, 155 130 Z" fill="#F43F5E"/>
  </svg>