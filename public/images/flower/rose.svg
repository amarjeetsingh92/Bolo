<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" rx="30" fill="#FFF1F2"/>
  <!-- Stem & Leaves -->
  <path d="M 200 240 Q 200 320 190 370" stroke="#15803D" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M 195 290 Q 140 280 130 300 Q 160 320 195 300" fill="#22C55E" stroke="#15803D" stroke-width="4"/>
  <path d="M 195 320 Q 250 310 260 330 Q 230 350 195 330" fill="#22C55E" stroke="#15803D" stroke-width="4"/>
  <!-- Sepal base -->
  <path d="M 170 240 Q 200 260 230 240 Q 200 220 170 240 Z" fill="#16A34A"/>
  <!-- Rose Blossom (Petals Layered) -->
  <circle cx="200" cy="160" r="85" fill="#E11D48"/>
  <!-- Outer Petals -->
  <path d="M 120 160 C 120 230, 280 230, 280 160 C 270 210, 130 210, 120 160 Z" fill="#BE123C"/>
  <path d="M 140 120 C 100 170, 140 220, 200 210 C 130 180, 150 140, 140 120 Z" fill="#F43F5E"/>
  <path d="M 260 120 C 300 170, 260 220, 200 210 C 270 180, 250 140, 260 120 Z" fill="#F43F5E"/>
  <!-- Inner Spiral -->
  <circle cx="200" cy="150" r="45" fill="#9F1239"/>
  <path d="M 175 140 C 180 120, 220 120, 225 140 C 220 160, 180 160, 175 140 Z" fill="#E11D48"/>
  <path d="M 185 145 C 190 135, 210 135, 215 145 C 210 155, 190 155, 185 145 Z" fill="#FB7185"/>
</svg>
