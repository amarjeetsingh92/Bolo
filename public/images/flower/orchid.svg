<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
    <rect width="400" height="400" rx="30" fill="#FAF5FF"/>
    <!-- Stem -->
    <path d="M 200 260 Q 200 340 190 380" stroke="#15803D" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Upper Sepals -->
    <ellipse cx="200" cy="100" rx="28" ry="55" fill="#F3E8FF" stroke="#A855F7" stroke-width="3"/>
    <ellipse cx="120" cy="210" rx="26" ry="50" transform="rotate(-30 120 210)" fill="#F3E8FF" stroke="#A855F7" stroke-width="3"/>
    <ellipse cx="280" cy="210" rx="26" ry="50" transform="rotate(30 280 210)" fill="#F3E8FF" stroke="#A855F7" stroke-width="3"/>
    <!-- Broad Lateral Petals -->
    <ellipse cx="110" cy="140" rx="55" ry="40" transform="rotate(-15 110 140)" fill="#E9D5FF" stroke="#9333EA" stroke-width="3"/>
    <ellipse cx="290" cy="140" rx="55" ry="40" transform="rotate(15 290 140)" fill="#E9D5FF" stroke="#9333EA" stroke-width="3"/>
    <!-- Central Lip (Labellum) -->
    <path d="M 170 180 C 160 240, 240 240, 230 180 C 240 230, 220 260, 200 260 C 180 260, 160 230, 170 180 Z" fill="#9333EA"/>
    <circle cx="200" cy="190" r="12" fill="#FACC15"/>
  </svg>