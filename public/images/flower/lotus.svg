<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
    <rect width="400" height="400" rx="30" fill="#F0FDF4"/>
    <!-- Water ripples -->
    <ellipse cx="200" cy="330" rx="140" ry="25" fill="#BAE6FD" opacity="0.6"/>
    <!-- Lotus Pad Leaf -->
    <ellipse cx="200" cy="325" rx="120" ry="20" fill="#15803D"/>
    <!-- Layer 1: Outer Pink Petals -->
    <path d="M 80 270 C 100 170, 190 210, 200 280 Z" fill="#F472B6"/>
    <path d="M 320 270 C 300 170, 210 210, 200 280 Z" fill="#F472B6"/>
    <!-- Layer 2: Middle Petals -->
    <path d="M 120 270 C 140 140, 190 150, 200 280 Z" fill="#EC4899"/>
    <path d="M 280 270 C 260 140, 210 150, 200 280 Z" fill="#EC4899"/>
    <!-- Layer 3: Central Pointed Petals -->
    <path d="M 160 270 C 170 120, 200 90, 200 280 Z" fill="#DB2777"/>
    <path d="M 240 270 C 230 120, 200 90, 200 280 Z" fill="#DB2777"/>
    <!-- Center bud tip -->
    <path d="M 185 270 C 190 110, 210 110, 215 270 Z" fill="#FDF2F8"/>
  </svg>