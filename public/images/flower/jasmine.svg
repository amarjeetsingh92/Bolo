      <ellipse cx="220" cy="110" rx="16" ry="45" transform="rotate(0 220 180)"/><ellipse cx="220" cy="110" rx="16" ry="45" transform="rotate(60 220 180)"/><ellipse cx="220" cy="110" rx="16" ry="45" transform="rotate(120 220 180)"/><ellipse cx="220" cy="110" rx="16" ry="45" transform="rotate(180 220 180)"/><ellipse cx="220" cy="110" rx="16" ry="45" transform="rotate(240 220 180)"/><ellipse cx="220" cy="110" rx="16" ry="45" transform="rotate(300 220 180)"/>
    </g>
